name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate catalog
        run: python3 scripts/validate-catalog.py

      - name: Check Copilot marketplace is up to date
        run: python3 scripts/sync-copilot-marketplace.py --check

      - name: Check plugin index is up to date
        run: python3 scripts/generate-plugin-index.py --check
